name: free-win

x-app: &app
  image: free-win-api:local
  build:
    context: .
  env_file:
    - .env
  extra_hosts:
    - host.docker.internal:host-gateway
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  restart: unless-stopped
  stop_grace_period: 30s
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  free-win-api:
    <<: *app
    environment:
      API_CORS_ALLOWED_ORIGINS: '${API_CORS_ALLOWED_ORIGINS:-["http://127.0.0.1:4321","http://localhost:4321"]}'
    ports:
      - "127.0.0.1:${FREE_WIN_API_PORT:-8000}:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    mem_limit: ${FREE_WIN_API_MEMORY_LIMIT:-512m}
    cpus: ${FREE_WIN_API_CPU_LIMIT:-0.75}
    pids_limit: ${FREE_WIN_API_PIDS_LIMIT:-256}

  free-win-delivery-worker:
    <<: *app
    command: [python, -m, src.api.deliveries.worker]
    mem_limit: ${FREE_WIN_WORKER_MEMORY_LIMIT:-256m}
    cpus: ${FREE_WIN_WORKER_CPU_LIMIT:-0.5}
    pids_limit: ${FREE_WIN_WORKER_PIDS_LIMIT:-128}
